[package]
name = "mandate-desktop"
version = "0.1.0"
description = "Mandate desktop shell"
authors = ["Mandate"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mandate_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
