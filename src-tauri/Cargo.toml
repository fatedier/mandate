[package]
name = "mandate-desktop"
version = "0.1.0"
description = "Mandate desktop shell"
authors = ["Mandate"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mandate_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# Matches @tauri-apps/plugin-notification in package.json.
tauri-plugin-notification = "~2.7"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
