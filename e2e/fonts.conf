<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The e2e browser's stand-ins for the app's fonts. The app asks for Apple's
  (SF Pro, SF Mono, Menlo), which Linux does not have, and falls through to
  system-ui, sans-serif and monospace. Left to itself this image answers all
  three with WenQuanYi Zen Hei, a Chinese face with one weight: semibold drew
  as regular. Roboto stands in for the sans: it is what an Android phone draws
  the app in, with every weight, and about 9% wider than SF Pro (measured over
  the app's words), so what fits here fits a Mac and an iPhone too. DejaVu
  Sans Mono stands in for the mono: Menlo is built from it, to the same
  widths. Chinese text still falls back to WenQuanYi.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
