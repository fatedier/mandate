<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Mandate</title>
    <link rel="icon" type="image/svg+xml" href="/brand/mandate-logo-panes.svg" />
    <script>
      // Pre-paint theme so the page doesn't flash dark before React hydrates.
      // Reads the same Zustand-persisted "ap.ui" blob that useUIStore writes
      // to (shape: { state: { theme, ... }, version }). Default "dark" if
      // nothing is stored / parse fails / theme isn't valid.
      try {
        var raw = localStorage.getItem("ap.ui");
        var theme = raw && JSON.parse(raw)?.state?.theme;
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
